name: CI

# Runs on every PR. On main it runs as the first stage of release.yml, which
# publishes only when every job here has passed — so there is no separate
# `push: main` trigger to run it twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Under workflow_call this caps the caller's write permissions: nothing in CI
# needs to write.
permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name under workflow_call, so a release run
  # and a PR run can never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that changes what ships must say how it versions. Without a changeset
  # a merge publishes nothing, and the change sits unreleased on main.
  changeset:
    name: changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset when the package changes
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- src package.json; then
            echo "No changes to src/ or package.json — no changeset needed."
            exit 0
          fi
          if git diff --name-only --diff-filter=A "$BASE"...HEAD -- .changeset \
              | grep -E '\.md$' | grep -v 'README\.md$' | grep -q .; then
            echo "Changeset found."
            exit 0
          fi
          echo "::error::This PR changes the published package but adds no changeset. Run 'npx changeset' and commit the file — or 'npx changeset --empty' if it should not release."
          exit 1

  verify:
    name: node ${{ matrix.node }} · next ${{ matrix.next }} · react ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        next: ["13.5", "14", "15", "16"]
        # Each Next major is tested against the React its App Router ships with;
        # installing next@15 alone left it running on this repo's React 18.
        include:
          - { next: "13.5", react: "18" }
          - { next: "14", react: "18" }
          - { next: "15", react: "19" }
          - { next: "16", react: "19" }
        exclude:
          # Next 16 requires Node >= 20.9.
          - { node: 18, next: "16" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # peerDependencies claims next >=13.0.0 — this is what makes that true.
      - name: Install the Next.js and React under test
        run: >-
          npm install --no-save --legacy-peer-deps
          next@${{ matrix.next }}
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}

      - run: npm run typecheck
      - run: npm test

  quality:
    name: lint · build · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

      # Build BEFORE testing: the binary tests spawn dist/cli/bin.js and skip
      # themselves when it is missing, so testing first would silently lose the
      # coverage that catches a CLI which runs under one filename but not another.
      - run: npm run build
      - run: npm run test:coverage

      # Catches the "CJS consumers get ESM type declarations" class of bug.
      - run: npx publint

  smoke:
    name: consume the real tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination /tmp

      # Installing the packed tarball exercises the real exports map through
      # the real resolver — the cheapest guard against packaging regressions.
      - name: Typecheck and build the example app against the tarball
        working-directory: examples/playground
        run: |
          npm install --no-audit --no-fund
          npm install --no-save /tmp/next-smart-router-*.tgz
          # Invoked by its bin name on purpose: that is how a consumer runs it,
          # and it exercises the npm symlink shim rather than a direct path.
          # The manifest is generated, not tracked — tsc needs it to exist
          # before `next build` (which would generate it) ever runs.
          npx next-smart-router generate --app-dir app --out route-manifest.ts

          # Fail here, not thirty lines later inside tsc, if the CLI no-opped.
          test -f route-manifest.ts || {
            echo "::error::next-smart-router generate produced no manifest"
            exit 1
          }

          npx tsc --noEmit
          npx next build
