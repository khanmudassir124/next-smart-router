name: Release

# Merge to main → publish to npm, in one step.
#
#   PR merged ──► CI (full matrix + tarball smoke) ──► changesets pending?
#                                                        │
#                                  no ──► nothing to release, stop
#                                  yes ─► version bump + CHANGELOG, committed to main
#                                           └─► build ─► npm publish ─► tag + GitHub release
#
# Versioning comes from the changeset files contributors add with their PRs (CI
# fails a PR that changes src/ without one), so a breaking change ships as a
# major instead of being auto-bumped to a patch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The branch tip, not the event SHA: when two merges land close
          # together, the second run must see the version commit the first run
          # pushed, or it would consume the same changesets twice.
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Publishing happens over OIDC trusted publishing — no NPM_TOKEN. That
      # needs npm >= 11.5.1, and neither Node 20 nor 22 bundles one, so the
      # runner's npm is upgraded explicitly.
      #
      # Pinned to ^11 rather than @latest: npm 12 requires a newer Node than
      # this job runs, so `npm install -g npm@latest` fails outright on the
      # engine check. Raising this range means raising node-version with it.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          node --version
          npm --version

      - run: npm ci

      # Consumes the pending changesets directly, instead of opening a
      # "Version Packages" PR that someone then has to remember to merge.
      - name: Version
        id: version
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets."
            exit 0
          fi

          npx changeset version
          # changeset version leaves the lockfile's own version behind.
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npx prettier --write CHANGELOG.md

          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v$version"
          # Fails loudly if main is protected against this push — see
          # CONTRIBUTING.md#releasing. Nothing is published in that case, so
          # git and npm never disagree about what was released.
          git push origin HEAD:main
          echo "Versioned $version"

      # After versioning: tsup bakes package.json's version into the CLI's
      # --version output.
      - run: npm run build

      # With no changesets left, the action skips versioning and runs publish,
      # which ships any package.json version npm doesn't have yet — including
      # one from an earlier run whose publish step failed. It then pushes the
      # vX.Y.Z tag and creates the GitHub release from the CHANGELOG entry.
      - name: Publish
        uses: changesets/action@v1
        with:
          publish: npm run changeset:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Left in place so setting the secret later Just Works. While it is
          # unset, the action reports "No NPM_TOKEN found, but OIDC is
          # available" and authenticates via trusted publishing instead, which
          # attaches provenance on its own — so NPM_CONFIG_PROVENANCE is not
          # set here. (`changeset publish` has no --provenance flag; it accepts
          # only --tag, --otp and --no-git-tag.)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
