name: Release

# Publishes whatever Changesets has queued. Versioning is driven by the
# changeset files contributors add with their PRs, so a breaking change ships
# as a major instead of being auto-bumped to a patch.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Publishing happens over OIDC trusted publishing — no NPM_TOKEN. That
      # needs npm >= 11.5.1, and Node 20 bundles npm 10.x, so the runner's npm
      # is upgraded explicitly rather than left to whatever Node ships.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx publint

      # Opens (or updates) a "Version Packages" PR when changesets are pending;
      # publishes when that PR is merged.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Left in place so setting the secret later Just Works. While it is
          # unset, the action reports "No NPM_TOKEN found, but OIDC is
          # available" and authenticates via trusted publishing instead, which
          # attaches provenance on its own — so NPM_CONFIG_PROVENANCE is not
          # set here. (`changeset publish` has no --provenance flag; it accepts
          # only --tag, --otp and --no-git-tag.)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
